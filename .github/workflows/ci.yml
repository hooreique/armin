name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Nix
        uses: DeterminateSystems/determinate-nix-action@v3.22.2

      - name: Run CI checks
        run: nix develop --command ./gradlew ci --no-daemon
